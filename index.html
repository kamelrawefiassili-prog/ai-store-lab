<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مختبر أداة المنتجات (Catalog Tool API)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace, system-ui; background: #1e1e1e; color: #d4d4d4; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .container { width: 100%; max-width: 700px; background: #252526; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { color: #4ec9b0; margin-top: 0; }
    .input-area { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; background: #3c3c3c; color: white; border: 1px solid #555; border-radius: 6px; outline: none; font-size: 14px; }
    button { padding: 12px 20px; background: #0e639c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1177bb; }
    pre { background: #1e1e1e; padding: 15px; border-radius: 6px; border: 1px solid #444; overflow-x: auto; color: #ce9178; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <h3>🛠️ واجهة اختبار أداة الكتالوج (Tool API Output)</h3>
  <p style="font-size: 12px; color: #888;">استعلام البيانات الموجهة للذكاء الاصطناعي الرئيسي (JSON Response)</p>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="أدخل كلمة البحث (مثال: هل لديكم هاتف)..." onkeypress="if(event.key==='Enter') testTool()">
    <button onclick="testTool()">إرسال الطلب</button>
  </div>

  <div id="status" style="font-size: 13px; color: #dcdcaa; margin-bottom: 10px;"></div>
  <pre id="jsonResult">// ستظهر نتيجة الـ JSON المنظمة هنا ليقرأها الذكاء الاصطناعي الرئيسي...</pre>
</div>

<script>
  const VERCEL_URL = '/api/chat';

  async function testTool() {
    const input = document.getElementById('userInput');
    const resultBox = document.getElementById('jsonResult');
    const statusBox = document.getElementById('status');
    
    if (!input.value.trim()) return;

    statusBox.innerText = '⏳ جاري استدعاء الـ API وفلترة المنتجات...';
    resultBox.innerText = 'Loading...';

    try {
      const res = await fetch(VERCEL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: input.value })
      });
      
      const data = await res.json();
      statusBox.innerText = '✅ تم استلام الاستجابة بنجاح (HTTP 200):';
      resultBox.innerText = JSON.stringify(data, null, 2);
    } catch (err) {
      statusBox.innerText = '❌ حدث خطأ في الاتصال:';
      resultBox.innerText = err.message;
    }
  }
</script>

</body>
</html>
